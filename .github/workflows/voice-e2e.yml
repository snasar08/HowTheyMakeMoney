name: New voice end-to-end test

# Push branch voice-e2e: exactly the nightly path for one Short with the new voice — voice job
# (Qwen3-TTS clone, own venv) -> render with VOICE_ENGINE=qwen (--dry, nothing posted) -> score it.
# The MP4, log and scores go to the "voice-e2e" release.
on:
  push:
    branches: ["voice-e2e"]

permissions:
  contents: write

env:
  TEST_ID: "074"

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HTMM_CACHE: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: qwen-models-v1
      - run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q -U qwen-tts openai-whisper soundfile numpy
      - run: python -m pipeline.voice_prepass $TEST_ID
      - uses: actions/upload-artifact@v4
        with:
          name: voice-${{ env.TEST_ID }}
          path: .cache/voice/
  make:
    needs: voice
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UPLOAD_MODE: buffer_dry
      VOICE_ENGINE: qwen
      QWEN_VOICE: narrator3
      KOKORO_VOICE: am_puck
      KOKORO_SPEED: "1.2"
      EGL_PLATFORM: surfaceless
      HTMM_CACHE: ${{ github.workspace }}/.cache
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng libegl1 libgl1-mesa-dri libegl-mesa0
      - run: pip install -q -r requirements.txt librosa resemblyzer
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: voice-*
          path: .cache/voice
          merge-multiple: true
      - name: Render (dry)
        run: |
          ls .cache/voice | wc -l
          python -m pipeline.run --id $TEST_ID --dry 2>&1 | grep -v "Warning\|warn(" | tee run.log
      - name: Score + publish
        if: always()
        run: |
          mkdir -p sc && cp out/*.mp4 sc/ 2>/dev/null || true
          for f in sc/*.mp4; do ffmpeg -loglevel error -y -i "$f" -vn -b:a 160k "${f%.mp4}.mp3"; done
          python bench/voice_score.py sc | tee scores.txt || true
          gh release delete voice-e2e --yes --cleanup-tag 2>/dev/null || true
          gh release create voice-e2e sc/*.mp4 run.log scores.txt --title "New voice: full Short test" --notes "Dry run, nothing posted."
