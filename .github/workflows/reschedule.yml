name: Reschedule a Short on Buffer

# Push branch reschedule/<id> (e.g. reschedule/030): schedules that delivered-as-release Short on
# Buffer at its post_at using the existing release asset, then commits the record to main.
on:
  push:
    branches: ["reschedule/**"]

permissions:
  contents: write

concurrency:
  group: make-shorts
  cancel-in-progress: false

jobs:
  reschedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      POST_IN_MIN: "15"  # one-off Nov 1: Sam wants the new-format 034 out now
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Schedule
        run: |
          git fetch -q origin "$GITHUB_REF_NAME"
          git checkout -q "origin/$GITHUB_REF_NAME" -- pipeline/reschedule.py pipeline/publish.py
          set -o pipefail  # a failure must fail the run, not hide behind tee
          python -m pipeline.reschedule "${GITHUB_REF_NAME#reschedule/}" 2>&1 | tee reschedule.log
      - name: Commit record to main
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git checkout -q HEAD -- pipeline
          git add content/scripts
          git diff --cached --quiet || git commit -qm "Rescheduled on Buffer: ${GITHUB_REF_NAME#reschedule/}"
          git pull --rebase -q origin main && git push -q origin HEAD:main
      - name: Save log to the branch
        if: always()
        run: |
          cp reschedule.log /tmp/r.log 2>/dev/null || echo "no log" > /tmp/r.log
          git fetch -q origin "$GITHUB_REF_NAME" && git switch -q -C logb "origin/$GITHUB_REF_NAME"
          cp /tmp/r.log reschedule-result.log && git add -f reschedule-result.log
          git -c user.name=shorts-bot -c user.email=shorts-bot@users.noreply.github.com commit -qm "reschedule log" && git push -q origin "HEAD:$GITHUB_REF_NAME"
