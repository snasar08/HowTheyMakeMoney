name: CI test (render + Buffer)

# Pushing to the ci-test branch runs the same render steps as "Make Shorts" on GitHub's machines,
# plus an end-to-end Buffer check that schedules and then deletes one test post. Results are
# committed to the ci-test-results branch as JSON (no secrets) so they can be read without
# GitHub admin access.
on:
  push:
    branches: [ci-test]

permissions:
  contents: write

concurrency:
  group: ci-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VOICE_ENGINE: kokoro
      KOKORO_VOICE: ${{ vars.KOKORO_VOICE || 'am_fenrir' }}
      KOKORO_SPEED: ${{ vars.KOKORO_SPEED || '1.35' }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      HTMM_CACHE: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - name: Python packages
        run: pip install -r requirements.txt
      - name: Cache voice model and images
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            .cache
          key: htmm-models-v1-${{ hashFiles('requirements.txt') }}
          restore-keys: htmm-models-v1-
      - name: Render 001 with the real voice (dry run)
        run: |
          start=$(date +%s)
          python -m pipeline.run --id 001 --dry 2>&1 | tee out-render.log
          echo "render_seconds=$(( $(date +%s) - start ))" >> out-render.log
      - name: Host the test video as a prerelease
        run: |
          gh release delete ci-test-video --yes --cleanup-tag 2>/dev/null || true
          gh release create ci-test-video out/001-costco.mp4 --prerelease \
            --title "CI test video (safe to delete)" --notes "Used by the CI Buffer test."
      - name: Buffer end-to-end (schedule, confirm, delete)
        run: |
          python -m pipeline.buffer_test \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/ci-test-video/001-costco.mp4" \
            out/buffer-test.json
      - name: Publish results to ci-test-results branch
        if: always()
        run: |
          mkdir -p /tmp/res && cp out-render.log /tmp/res/ 2>/dev/null || true
          cp out/buffer-test.json /tmp/res/ 2>/dev/null || true
          cp previews/001-costco.jpg /tmp/res/ 2>/dev/null || true
          echo "{\"run\": \"${GITHUB_RUN_ID}\", \"sha\": \"${GITHUB_SHA}\", \"at\": \"$(date -u +%FT%TZ)\"}" > /tmp/res/meta.json
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          cd /tmp/res && git init -q -b ci-test-results && git add -A
          git -c user.name=shorts-bot -c user.email=shorts-bot@users.noreply.github.com \
            commit -qm "CI test results ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-test-results
