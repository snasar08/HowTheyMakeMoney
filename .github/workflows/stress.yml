name: Stress test (temporary)
on:
  push:
    branches: ["stress-test"]
    paths: [".github/workflows/stress.yml", "pipeline/**"]
permissions:
  contents: write
jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        id: ["003", "006", "023", "044", "048", "051", "056", "060", "062"]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VOICE_ENGINE: kokoro
      KOKORO_VOICE: am_puck
      KOKORO_SPEED: "1.2"
      UPLOAD_MODE: release
      HTMM_CACHE: ${{ github.workspace }}/.cache
      RENDER_3D: "on"
      EGL_PLATFORM: surfaceless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          for i in 1 2 3; do
            sudo timeout 240 apt-get update -qq && sudo timeout 300 apt-get install -y -qq ffmpeg espeak-ng libegl1 libgl1-mesa-dri libegl-mesa0 && exit 0
            sleep 20
          done
          exit 1
      - run: pip install -q -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/whisper
            .cache
          key: htmm-models-v2-${{ hashFiles('requirements.txt') }}
          restore-keys: htmm-models-v2-
      - name: Render (dry)
        run: |
          set -o pipefail
          python -m pipeline.run --id ${{ matrix.id }} --dry 2>&1 | tee make.log || echo "RENDER FAILED" >> make.log
      - name: Save results
        if: always()
        run: |
          mkdir -p stress
          cp make.log stress/${{ matrix.id }}.log || true
          cp previews/${{ matrix.id }}-*.jpg stress/ || true
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add -f stress
          git commit -qm "Stress result ${{ matrix.id }}" || exit 0
          for i in 1 2 3 4 5 6 7 8; do
            git pull -q --rebase origin stress-test && git push -q origin HEAD:stress-test && exit 0
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
