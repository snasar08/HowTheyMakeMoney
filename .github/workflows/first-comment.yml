name: First comment on new Shorts

# Sam, Nov 22: the channel comments on every Short we post (the Short's question, e.g. "Bolt or a cheetah? 👇").
# pipeline/first_comment.py. Same comment login as the Saturday replies (YTC_* secrets). Runs every hour (Nov 26: was 2 h; 178 got its comment 4.5 h after posting) so it
# catches each Buffer post soon after it goes live. Push to branch first-comment-test = DRY RUN (posts nothing).
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: ["first-comment-test"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: first-comment
  cancel-in-progress: false

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Comment on new Shorts
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YTC_CLIENT_ID: ${{ secrets.YTC_CLIENT_ID }}
          YTC_CLIENT_SECRET: ${{ secrets.YTC_CLIENT_SECRET }}
          YTC_REFRESH_TOKEN: ${{ secrets.YTC_REFRESH_TOKEN }}
          COMMENT_DRY: ${{ github.ref == 'refs/heads/first-comment-test' && '1' || '' }}
        run: python -m pipeline.first_comment
      - name: Save the log to main
        if: github.ref != 'refs/heads/first-comment-test'
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add analytics/first_comments.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "First comments $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 10; done
