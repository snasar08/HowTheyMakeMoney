name: Voice check

# Nov 26: every day, 30 min before the nightly's first run (08:00 UTC), voice the next 2 Shorts the nightly would post
# with the Gemini quality loop (pipeline/voice_prepass.py + pipeline/voice_check.py: up to VOICE_MAX_TAKES takes, the best
# one kept, Edge Andrew if none passes). The checked read lands in the SAME actions/cache key the nightly voice job uses,
# so the nightly reuses it and spends no second Gemini request. The mp3 of every chosen read + a report.md (one table per
# Short) go to the GitHub release "voice-check" so Sam can listen. Nothing is rendered or posted.
on:
  schedule:
    - cron: "30 7 * * *"
  push:
    branches: [voice-check-run]   # run now without gh: git push origin main:voice-check-run
  workflow_dispatch:
    inputs:
      ids:
        description: "Script ids to voice (e.g. 182,183). Leave blank for the next 2 the nightly would post."
        default: ""

permissions:
  contents: write

concurrency:
  group: voice-check
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    env:
      POST_START: ${{ vars.POST_START || '2026-10-27' }}
      POST_SLOTS: "12:00,19:00"   # same as the nightly plan job
      MAX_PER_DAY: "2"
      IDS_IN: ${{ inputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - id: ids
        run: |
          # the nightly's own chooser (pipeline.run: ready_scripts + share balance), asked for 2; --dry skips the open-slot test
          # so this works whenever it runs. The plan file holds the 2 Shorts + 2 spares: take the first 2.
          if [ -n "$IDS_IN" ]; then
            echo "$IDS_IN" | tr ', ' '\n\n' | sed '/^$/d' > ids.txt
          else
            python -m pipeline.run --count 2 --dry --plan-ids plan.txt || true
            head -2 plan.txt > ids.txt 2>/dev/null || true
          fi
          cat ids.txt 2>/dev/null || true
          echo "ids=$(python -c "import json,os;print(json.dumps([l.strip() for l in open('ids.txt') if l.strip()] if os.path.exists('ids.txt') else []))")" >> "$GITHUB_OUTPUT"

  voice:
    needs: plan
    if: ${{ needs.plan.outputs.ids != '[]' && needs.plan.outputs.ids != '' }}
    strategy:
      fail-fast: false
      max-parallel: 1          # Gemini free tier: 3 requests a minute
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HTMM_CACHE: ${{ github.workspace }}/.cache
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_VOICE: ${{ vars.GEMINI_VOICE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the SAME key as the nightly voice job: a read checked here is reused there
      - uses: actions/cache@v4
        with:
          path: .cache/voice
          key: voice-${{ matrix.id }}-${{ hashFiles('pipeline/voice_prepass.py', 'pipeline/voice_check.py', 'pipeline/tts.py', 'pipeline/gemini_tts.py', format('content/scripts/{0}-*.json', matrix.id)) }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: qwen-models-v1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q -U openai-whisper soundfile numpy edge-tts
      - name: Voice with the quality loop
        run: python -m pipeline.voice_prepass ${{ matrix.id }}
      - name: Build the mp3 of the chosen read + the report
        run: |
          mkdir -p vc
          python - <<'PY'
          import sys
          import soundfile as sf
          from pipeline import voice_prepass as vp
          r = vp.read_wav("${{ matrix.id }}")
          if r is None:
              sys.exit("no voiced lines in the cache for ${{ matrix.id }}")
          sf.write("vc/read.wav", r[0], r[1])
          PY
          ffmpeg -loglevel error -y -i vc/read.wav -b:a 128k "vc/voice-${{ matrix.id }}.mp3"
          rm -f vc/read.wav
          if [ -f ".cache/voice/report-${{ matrix.id }}.md" ]; then cp ".cache/voice/report-${{ matrix.id }}.md" "vc/report-${{ matrix.id }}.md"
          else printf '### Short %s\n\nAlready voiced earlier (cache hit): no new check this run.\n' "${{ matrix.id }}" > "vc/report-${{ matrix.id }}.md"; fi
          cp ".cache/voice/report-${{ matrix.id }}.json" vc/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: vc-${{ matrix.id }}
          path: vc/
          retention-days: 2

  release:
    needs: voice
    if: ${{ always() && needs.voice.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: vc-*
          path: vc
          merge-multiple: true
      - name: Upload to the voice-check release
        run: |
          ls vc 2>/dev/null || { echo "::warning title=voice check::nothing to upload"; exit 0; }
          { echo "# Voice check $(date -u +%F)"; echo; for f in $(ls vc/report-*.md 2>/dev/null | sort); do cat "$f"; echo; done; } > vc/report.md
          cat vc/report.md >> "$GITHUB_STEP_SUMMARY"
          gh release view voice-check >/dev/null 2>&1 || gh release create voice-check --title "voice-check" \
            --notes "Daily voice check: the chosen read of the next Shorts (mp3) and report.md. Overwritten every run."
          gh release upload voice-check vc/*.mp3 vc/report.md --clobber
