name: 3D renderer benchmark

# Branch 3d-upgrade only: times the candidate CPU 3D renderers on GitHub's 2-core runner and
# pushes the numbers to bench/results.json on the same branch.
on:
  push:
    branches: ["3d-upgrade"]
    paths: ["bench/**", "pipeline/gl3d.py", "pipeline/scene3d.py", ".github/workflows/bench3d.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Mesa software GL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1-mesa-dri libegl-mesa0 blender
      - run: pip install -q moderngl pillow numpy
      - name: moderngl / llvmpipe
        env:
          EGL_PLATFORM: surfaceless
        run: |
          nproc
          for cfg in "1080 1920 4" "1080 1920 2" "1080 1920 0" "720 1280 4"; do
            set -- $cfg
            W3D=$1 H3D=$2 MSAA_3D=$3 python bench/bench_gl.py | tee -a bench/gl.jsonl
          done
      - name: Blender Cycles
        continue-on-error: true
        run: |
          blender --version | head -1 | tee bench/blender.txt
          blender -b -P bench/bench_blender.py 2>&1 | grep BLENDER_SECONDS | tee -a bench/blender.txt
      - name: Push results
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add -f bench/gl.jsonl bench/blender.txt bench/frame_*.png 2>/dev/null
          git commit -qm "3D bench results" && git pull --rebase -q origin 3d-upgrade && git push -q origin HEAD:3d-upgrade
