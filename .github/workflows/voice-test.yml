name: Voice samples

on:
  workflow_dispatch:
    inputs:
      try_ming:
        description: "Also try Ming-3.0 on GitHub's CPU (slow, experimental)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  kokoro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: htmm-models-v1-${{ hashFiles('requirements.txt') }}
          restore-keys: htmm-models-v1-
      - name: Make voice sample video
        run: python -m pipeline.voice_samples out/voice-samples.mp4
      - name: Publish as a release
        run: |
          gh release delete voice-samples --yes --cleanup-tag 2>/dev/null || true
          gh release create voice-samples out/voice-samples.mp4 \
            --title "Pick a narrator voice" \
            --notes "Same line, 8 voices (numbered on screen). Reply with the number you like. A Ming-3.0 sample is added here too if it runs on GitHub's free machines."

  ming:
    if: ${{ inputs.try_ming }}
    needs: kokoro
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      GH_TOKEN: ${{ github.token }}
      MING_REPO: ${{ github.workspace }}/Ming-3.0-tts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Ming-3.0-tts (CPU)
        run: |
          git clone --depth 1 https://github.com/inclusionAI/Ming-3.0-tts.git
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchaudio
          grep -viE '^(torch|torchaudio|flash)' Ming-3.0-tts/requirements.txt > ming-req.txt || true
          pip install -r ming-req.txt
          pip install soundfile numpy pillow
      - name: Generate Ming sample
        run: python -m pipeline.voice_samples out/voice-ming.mp4
        env:
          VOICE_SAMPLE_ENGINE: ming
      - name: Add to the release
        run: gh release upload voice-samples out/voice-ming.mp4 --clobber
