name: 3D end-to-end test

# Pushing branch 3d-e2e renders real Shorts with the real voice, audio + clarity checks, the
# quality gate, 3D scenes on Mesa llvmpipe, and a Buffer DRY RUN (read-only channel lookup and
# the exact post payload; nothing is posted). Timings, logs and stills are force-pushed to
# branch 3d-e2e-results; the MP4s are kept as the "e2e-shorts" artifact for 7 days.
on:
  push:
    branches: ["3d-e2e"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 3d-e2e
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UPLOAD_MODE: buffer_dry
      POST_START: "2026-10-01"
      AUDIO_CHECK: warn
      KOKORO_VOICE: am_fenrir
      KOKORO_SPEED: "1.25"
      EGL_PLATFORM: surfaceless
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      HTMM_CACHE: ${{ github.workspace }}/.cache
      E2E_IDS: "${{ vars.E2E_IDS || '030 031 032 005' }}"
      E2E_NIGHTLY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng libegl1 libgl1-mesa-dri libegl-mesa0
      - name: Python packages
        run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/whisper
            .cache
          key: htmm-models-v1-${{ hashFiles('requirements.txt') }}
          restore-keys: htmm-models-v1-
      - name: Render + checks + gate + Buffer dry run
        run: |
          mkdir -p e2e
          nproc | tee e2e/nproc.txt
          python -m pipeline.zone_check 2>&1 | tail -3 | tee e2e/zone.txt
          if [ -n "$E2E_NIGHTLY" ]; then  # the real nightly path: slot-aware, Buffer dry run
            python -m pipeline.run 2>&1 | grep -v "Warning\|warn(" | tee e2e/run-nightly.log
            echo "now $(TZ=America/New_York date)" >> e2e/run-nightly.log
          fi
          for id in $E2E_IDS; do
            start=$(date +%s)
            python -m pipeline.run --id $id 2>&1 | grep -v "Warning\|warn(" | tee e2e/run-$id.log
            echo "$id $(( $(date +%s) - start ))" | tee -a e2e/seconds.txt
          done
      - name: Stills
        if: always()
        run: |
          for f in out/*.mp4; do
            n=$(basename "$f" .mp4)
            for t in 1 6 10 15 22; do ffmpeg -v error -y -ss $t -i "$f" -frames:v 1 -vf scale=270:480 "e2e/$n-$t.png" || true; done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-shorts
          path: out/*.mp4
          retention-days: 7
      - name: Push results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/res && mkdir -p /tmp/res && cp -r e2e /tmp/res/ 2>/dev/null || true
          cd /tmp/res && git init -q -b 3d-e2e-results && git add -A
          git -c user.name=shorts-bot -c user.email=shorts-bot@users.noreply.github.com commit -qm "results ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" 3d-e2e-results
