name: Make Shorts

on:
  # GitHub starts scheduled runs late (Oct 26-28: 5.5-6.5 h late), so render the EVENING BEFORE
  # and keep a morning backup. Both only fill open slots (pipeline/publish.py), so extra runs —
  # backup, late or manual — never double-post.
  schedule:
    - cron: "0 8 * * *"     # ~3 AM New York (EST; Sam, Nov 3) — fills today's 3 slots; even 6 h late it's before noon
    - cron: "41 13 * * *"   # ~9:41 AM New York backup — fills anything still open today
  workflow_dispatch:
    inputs:
      count:
        description: "How many Shorts to make"
        default: "3"
      script_id:
        description: "Only this script id (e.g. 001). Leave blank for next in queue."
        default: ""
      dry_run:
        description: "Render only (no delivery, no status change)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: make-shorts
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHORTS_PER_RUN: "3"   # Sam, Nov 3: 3 posts a day
      UPLOAD_MODE: ${{ vars.UPLOAD_MODE || 'buffer' }}
      POST_START: ${{ vars.POST_START || '2026-10-27' }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      AUDIO_CHECK: ${{ vars.AUDIO_CHECK || 'warn' }}
      VOICE_ENGINE: ${{ vars.VOICE_ENGINE || 'kokoro' }}
      KOKORO_VOICE: am_puck   # Oct 30: Sam wants a male voice; am_puck = top-rated male (C+), most expressive
      KOKORO_SPEED: "1.2"
      POST_SLOTS: "12:00,15:00,18:00"
      MAX_PER_DAY: "3"
      GH_TOKEN: ${{ github.token }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      HTMM_CACHE: ${{ github.workspace }}/.cache
      RENDER_3D: ${{ vars.RENDER_3D || 'on' }}   # repo variable RENDER_3D=off -> old 2D charts
      EGL_PLATFORM: surfaceless
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng libegl1 libgl1-mesa-dri libegl-mesa0

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Cache voice model and images
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/whisper
            .cache
          key: htmm-models-v2-${{ hashFiles('requirements.txt') }}
          restore-keys: htmm-models-v2-

      - name: Lint scripts (warnings only)
        run: python -m pipeline.lint || true

      - name: Make Shorts
        run: |
          ARGS="--count ${{ inputs.count || env.SHORTS_PER_RUN }}"
          if [ -n "${{ inputs.script_id }}" ]; then ARGS="$ARGS --id ${{ inputs.script_id }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          python -m pipeline.run $ARGS

      - name: Save test videos (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: test-shorts
          path: out/*.mp4
          retention-days: 7

      - name: Save preview frames (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add previews
          git diff --cached --quiet || git commit -m "Preview frames $(date -u +%F)"
          git pull --rebase --quiet && git push

      - name: Mark scripts as delivered
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add content/scripts
          git diff --cached --quiet || git commit -m "Delivered Shorts $(date -u +%F)"
          git pull --rebase --quiet && git push

      - name: Alert on failure (opens or comments on one issue)
        if: failure()
        run: |
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          n=$(gh issue list --state open --label nightly-failure --json number -q '.[0].number' 2>/dev/null || true)
          if [ -n "$n" ]; then gh issue comment "$n" --body "Failed again: $url"
          else
            gh label create nightly-failure --color d73a4a 2>/dev/null || true
            gh issue create --label nightly-failure --title "Nightly Shorts run failed"               --body "The daily run failed: $url. Nothing is lost; the scripts stay ready and retry tomorrow."
          fi
