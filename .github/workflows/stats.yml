name: Weekly YouTube stats

# Fridays, so Saturday's script writer sees fresh numbers in content/performance.json.
# Needs the YT_API_KEY secret (free YouTube Data API key); does nothing without it.
on:
  schedule:
    - cron: "17 14 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pull public stats
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python -m pipeline.stats
      - name: Commit
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add content/performance.json 2>/dev/null || exit 0
          git diff --cached --quiet || git commit -qm "Weekly stats $(date -u +%F)"
          git pull --rebase --quiet origin main && git push origin HEAD:main
