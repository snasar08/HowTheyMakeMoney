name: Daily YouTube stats

# Daily (and on push to branch stats-run): public views/likes/comments per Short ->
# analytics/stats.json (time series, tagged by format/style/hook/...), then analytics/insights.md
# + format_weights.json for the Saturday writer and the queue order. Needs the YT_API_KEY secret
# (free, read-only); without it, analytics/status.json says so and nothing else changes.
on:
  schedule:
    - cron: "7 11 * * *"   # ~7 AM New York, before the backup run
  push:
    branches: ["stats-run"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: make-shorts
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect + analyze
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          python -m pipeline.stats
          python -m pipeline.insights
      - name: Commit to main
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add analytics
          git diff --cached --quiet || git commit -qm "Stats $(date -u +%F)"
          git pull --rebase -q origin main && git push -q origin HEAD:main
